<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión - Embarques</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="contenedor" style="margin-top:80px;">
    <div class="card">
      <h2>Iniciar sesión</h2>
      <form id="form-login">
        <label for="correo">Correo</label>
        <input type="email" id="correo" required autocomplete="username" />

        <label for="contrasena">Contraseña</label>
        <div class="campo-password">
          <input type="password" id="contrasena" required autocomplete="current-password" />
          <button type="button" id="ver-contrasena" class="ojo" aria-label="Mostrar contraseña" title="Mostrar contraseña">
            <svg id="icono-ojo" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>


<div class="login-options">
    <label>
        <input type="checkbox" id="recordar" name="remember">
        Recuérdame
    </label>
</div>

        <button type="submit" class="primario">Entrar</button>
        <div id="mensaje" class="mensaje"></div>
      </form>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
