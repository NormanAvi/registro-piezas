<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión - Registro de Piezas</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="contenedor" style="margin-top:80px;">
    <div class="card">
      <h2>Iniciar sesión</h2>
      <form id="form-login">
        <label for="correo">Correo</label>
        <input type="email" id="correo" required autocomplete="username" />

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" required autocomplete="current-password" />

        <button type="submit" class="primario">Entrar</button>
        <div id="mensaje" class="mensaje"></div>
      </form>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
